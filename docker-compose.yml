services:
  postgres:
    image: postgres:16-alpine
    container_name: roi_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Allow password-authenticated connections from any host.
      # Port is bound to 127.0.0.1 only, so this is safe for local dev.
      # Needed because Docker Desktop on Windows routes host→container
      # traffic via the bridge network (172.x.x.x), not 127.0.0.1.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - analytics_net

  metabase:
    image: metabase/metabase:v0.50.21
    container_name: roi_metabase
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: Europe/Warsaw
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - analytics_net

volumes:
  postgres_data:
  metabase_data:

networks:
  analytics_net:
    driver: bridge
