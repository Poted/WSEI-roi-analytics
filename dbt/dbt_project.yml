name: 'roi_analytics'
version: '1.0.0'
config-version: 2

profile: 'roi_analytics'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  roi_analytics:
    staging:
      +materialized: view
      +schema: staging
      criteo:
        +tags: ["criteo", "staging"]
      olist:
        +tags: ["olist", "staging"]
    dimensions:
      +materialized: table
      +schema: dimensions
      +tags: ["dimensions"]
    facts:
      +materialized: table
      +schema: facts
      +tags: ["facts"]
    marts:
      +materialized: table
      +schema: marts
      attribution:
        +tags: ["attribution", "criteo"]
      roi:
        +tags: ["roi", "olist"]
